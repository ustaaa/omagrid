# Experimental Flatpak manifest for a locally built single-file bundle
# (omagrid-<version>-linux-<arch>.flatpak). Build it with packaging/linux/flatpak-bundle.sh.
#
# It repackages the release's own Linux tarball (omagrid-<version>-linux-<arch>.tar.gz,
# built on Ubuntu 24.04 by package.sh) instead of compiling Rust inside flatpak-builder: no
# network and no vendored crate sources during the build, a few seconds instead of 20+ minutes,
# and byte-for-byte the same binaries as the AppImage/deb/rpm. The script unpacks the tarball
# into `stage/` next to a copy of this file. The binaries need glibc >= 2.39 and load X11,
# Wayland, xkbcommon and Vulkan/GL at runtime; the freedesktop runtime has all of them, and the
# GPU driver comes from its org.freedesktop.Platform.GL extension.
#
# io.github.ustaaa.OmaGrid.yml (same directory) is the from-source manifest for Flathub. Keep
# runtime, runtime-version, sdk and finish-args identical in both (packaging-lint checks this).
id: io.github.ustaaa.OmaGrid
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: omagrid
finish-args:
  # Display: Wayland first; X11 only when no Wayland compositor is running.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM). Without it the X11 fallback is slow or fails.
  - --share=ipc
  # GPU access for rendering.
  - --device=dri
  # Printing uses the host CUPS socket and Avahi service; network sharing stays disabled.
  - --socket=cups
  - --system-talk-name=org.freedesktop.Avahi
  - --filesystem=~/.cups:ro
  # Open/Save dialogs use the file-chooser portal (rfd), and drag-and-drop uses the document
  # portal, so broad filesystem access isn't needed. Documents and Downloads are granted for
  # opening workbooks by path from the command line.
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  # Read only the active Omarchy palette, across v3 and v4 layouts.
  - --filesystem=~/.local/state/omarchy/current:ro
  - --filesystem=xdg-config/omarchy/current:ro
  # Deliberately not granted: network (the optional --control channel listens on 127.0.0.1 in
  # the sandbox; `flatpak override --user --share=network io.github.ustaaa.OmaGrid` exposes it to
  # host agents) and home/host filesystem access.
# Skip the debuginfo pass: release runners may not provide eu-strip for CUPS tools.
build-options:
  no-debuginfo: true
modules:
  # CUPS client tools for craft-print: the runtime has libcups but not lpstat/lp/lpoptions.
  # Linked statically against this release's libcups, so a runtime update can't break them;
  # the socket path matches the host's, which --socket=cups mounts.
  - name: cups-client
    buildsystem: simple
    build-commands:
      - ./configure --prefix=/app --sysconfdir=/etc --localstatedir=/var --with-rundir=/run/cups
        --with-domainsocket=/run/cups/cups.sock --disable-shared --with-components=libcups
        --with-dnssd=avahi --with-tls=gnutls --disable-pam --disable-dbus
      - make -C cups libs
      - make -C systemv lp lpoptions lpstat
      - install -Dm755 -t /app/libexec/cups systemv/lp systemv/lpoptions systemv/lpstat
      - for tool in lp lpoptions lpstat; do install -Dm755 cups-socket.sh "/app/bin/$tool"; done
      - install -Dm644 -t /app/share/licenses/cups LICENSE NOTICE
    sources:
      - type: archive
        url: https://github.com/OpenPrinting/cups/releases/download/v2.4.20/cups-2.4.20-source.tar.gz
        sha256: ab4d9cd7f3e58060091d2b24972223d6401675f11c49b65abf4f6ef31dea22ff
      - type: script
        dest-filename: cups-socket.sh
        commands:
          - 'conf="$HOME/.cups/client.conf"'
          - 'if [ -z "${CUPS_SERVER:-}" ] && [ -r "$conf" ]; then'
          - '  server=$(sed -n ''s/^[[:space:]]*[Ss][Ee][Rr][Vv][Ee][Rr][Nn][Aa][Mm][Ee][[:space:]]\{1,\}\([^[:space:]]*\).*/\1/p'' "$conf" | tail -n 1)'
          - '  case "$server" in'
          - '    /*)'
          - '      mounted=$(sed -n ''s/^[[:space:]]*ServerName \(.*\)$/\1/p'' "$conf" | sed ''s/^[[:space:]]*//'' | grep -m 1 ''^/[^:]*$'')'
          - '      if [ "$mounted" = "$server" ]; then'
          - '        export CUPS_SERVER=/var/run/cups/cups.sock'
          - '      else'
          - '        echo "${0##*/}: ~/.cups/client.conf names the CUPS socket $server, but Flatpak gave this app ${mounted:-a different one}; give each socket one ServerName line, spelled ServerName" >&2'
          - '        exit 1'
          - '      fi'
          - '      ;;'
          - '  esac'
          - 'fi'
          - 'exec "/app/libexec/cups/${0##*/}" "$@"'
  - name: omagrid
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/omagrid /app/bin/omagrid
      # Headless CLI and MCP server: `flatpak run --command=omagrid-cli io.github.ustaaa.OmaGrid`.
      - install -Dm755 bin/omagrid-cli /app/bin/omagrid-cli
      - install -Dm644 share/applications/io.github.ustaaa.OmaGrid.desktop /app/share/applications/io.github.ustaaa.OmaGrid.desktop
      - install -Dm644 share/mime/packages/io.github.ustaaa.OmaGrid.xml /app/share/mime/packages/io.github.ustaaa.OmaGrid.xml
      # Already has the release's version and date substituted by package.sh.
      - install -Dm644 share/metainfo/io.github.ustaaa.OmaGrid.metainfo.xml /app/share/metainfo/io.github.ustaaa.OmaGrid.metainfo.xml
      - mkdir -p /app/share/icons /app/share/doc && cp -R share/icons/hicolor /app/share/icons/ && cp -R share/doc/omagrid /app/share/doc/
    sources:
      - type: dir
        path: stage
